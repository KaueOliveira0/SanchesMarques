  <!-- Glass pane highlight -->
  <rect x="116" y="116" width="124" height="280" rx="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="4" />
  <rect x="272" y="116" width="124" height="280" rx="10" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="4" />
  <!-- S&M Emblem -->
  <circle cx="256" cy="256" r="64" fill="#0f172a" stroke="#f59e0b" stroke-width="8" />
  <text x="256" y="274" font-family="sans-serif" font-weight="900" font-size="44" fill="#f59e0b" text-anchor="middle">S&amp;M</text>
